[hf_endpoints]
embedding_endpoint_url = https://xxxxxxxxxxendpoints.huggingface.cloud
reranker_endpoint_url = https://xxxxxxxx.endpoints.huggingface.cloud
# For local TEI endpoints, set to:
# embedding_endpoint_url = http://tei-embedding:80
# reranker_endpoint_url = http://tei-reranker:80


[qdrant]
# Modes: 'native' for direct QdrantClient, 'gradio' for Gradio Gateway access
# for native just give url
# for a local Qdrant container, pass mode=native and
# url = http://qdrant:6333, port = 6333
mode = native
url = org-name-of-space.hf.space
# NOTE: The API key should be set via QDRANT_API_KEY environment variable.
port = 443
collection = demo
# Optional TLS override. Leave commented to derive automatically - uncomment to force either way
# https = false

[retrieval]
# Top k docs from retriever - cut to reranker_k value by the reranker (if enabled)
top_k = 20

# --- Reranking ---
reranker_enabled = true
# cut down from top_k value
reranker_top_k = 5

# --- Hybrid retrieval (dense + BM25 sparse) ---
hybrid_enabled = false
# Set the top k limit for each search branch (best to set this high)
prefetch_top_k = 100

# model and stemmer language MUST match the values used when the collection was ingested.
sparse_model = Qdrant/bm25
sparse_language = english

# RRF weights - only the ratio matters (equal weights count both branches the same)
dense_weight = 0.5
sparse_weight = 0.5

# The RRF smoothing constant (60 is the standard value used - generally shouldn't be changed)
rrf_k = 60

[generator]
# Independent LLM config 
PROVIDER = huggingface
MODEL = https://xxxxxxxxxxx.huggingface.cloud
MAX_TOKENS = 1024
TEMPERATURE = 0.1
INFERENCE_PROVIDER = XYZ # required for provider huggingface, else parse random value
ORGANIZATION = ABC # required for provider huggingface, else parse random value
CONTEXT_META_FIELDS = filename,project_id,document_source
TITLE_META_FIELDS = filename,page
AZURE_ENDPOINT = DEF # required for provider azure, else parse random value

# Optional per-deployment system prompt guidelines (plain text, appended after the
# framework's base prompt). This can only ADD to the prompt, never override the
# framework's non-negotiable content rules (see FRAMEWORK_VALUES in
# src/components/generator/prompts.py, which is code-only and not configurable here or
# anywhere in this file, by design). Now comes from INSTANCE_CONFIG_DIR/instance.yaml's
# `instance_guidelines` key, not a params.cfg-configured path — see README.md's
# "Instance Configuration". Absent/unset = none.

[ingestor]
# Size of each text chunk in characters
chunk_size = 700
# Overlap between consecutive chunks in characters
chunk_overlap = 50
# Maximum number of chunks to send to LLM (prevents context overflow)
max_chunks = 20
# Text separators for splitting, comma-separated (order of preference)
separators = \n\n,\n,. ,! ,? , ,

[conversation_history]
# Number of past user turns passed to filter extraction and generation context
MAX_TURNS = 3
# Maximum characters of conversation context passed to generation
MAX_CHARS = 8000

[metadata_filters]
# Qdrant payload field names the LLM may extract filters for, with their types.
# Format: field:type pairs, comma-separated. Types: str, int, list.
# Leave empty to disable filter extraction entirely (extract_filters node becomes a pass-through).
# Example: filterable_fields = project_id:str,year:int,tags:list
filterable_fields = crop_type:list,title:str
# Independent LLM config  (REQUIRED when filterable_fields is non-empty)
llm_provider = huggingface
llm_model = https://xxxxxxxxxxx.huggingface.cloud
llm_max_tokens = 256
llm_temperature = 0.1
# llm_inference_provider / llm_organization needed for huggingface serverless; llm_azure_endpoint for azure.
llm_inference_provider = XYZ
llm_organization = ABC

[query_rewriter]
# When false, the rewrite_query node is omitted from the graph
enabled = true

# db_context (abstract, glossary) now comes from INSTANCE_CONFIG_DIR/instance.yaml's
# `db_context` key, not a params.cfg-configured path — see README.md's "Instance Configuration".

# Target language for cross-lingual rewriting ISO code (e.g. "ar" for Arabic, "en" for English)
# the rewriter translates source-language queries into target_language.
# Leave empty to disable cross-lingual rewriting.
target_language =

# Independent LLM config  (REQUIRED when enabled = true)
llm_provider = huggingface
llm_model = https://xxxxxxxxxxx.huggingface.cloud
llm_max_tokens = 256
llm_temperature = 0.1
llm_inference_provider = XYZ
llm_organization = ABC

[input_guard]
# When false, the input_guard branch is omitted from the graph
enabled = false
# Classification mode:
#   classifier — Qwen3Guard-Gen container (vLLM/SGLang OpenAI-compatible endpoint)
#   llm        — its OWN independent LLM (configured via llm_* below), in-context classification
mode = llm
# Classifier-mode endpoint (required when mode=classifier), e.g. http://qwen3guard:8000
endpoint_url =
# Classifier-mode model id
model = Qwen/Qwen3Guard-Gen-0.6B
# Independent LLM config for `mode = llm` (REQUIRED when enabled = true AND mode = llm)
# Should be a small/fast model so the guard returns within timeout_s. 
llm_provider = huggingface
llm_model = https://xxxxxxxxxxx.huggingface.cloud
llm_max_tokens = 64
llm_temperature = 0.0
llm_inference_provider = XYZ
llm_organization = ABC

# Block on "controversial" severity in addition to "unsafe" (defaults to "unsafe")
block_controversial = false
# Guard call timeout in seconds — keeps the parallel branch off the critical path.
# On any error/timeout the guard logs and fails open (allows the query).
timeout_s = 2.0
# Fixed warning shown when an input is blocked
blocked_message = I'm sorry, but I can't help with that request.

[output_guard]
# Two output guard components: 1) Classification; 2) Keyword-based blocking

# --- 1. Classification ---
# Monitor windowed output stream (RESPONSE only) for unsafe/controversial content.
# A hit stops the stream and classification_message is shown.
classification_enabled = false
# Classification mode:
#   classifier — Qwen3Guard-Gen container (vLLM/SGLang OpenAI-compatible endpoint)
#   llm        — its OWN independent LLM (configured via llm_* below), in-context classification
mode = llm
# Classifier-mode endpoint (required when mode=classifier), e.g. http://qwen3guard:8000
endpoint_url =
# Classifier-mode model id
model = Qwen/Qwen3Guard-Gen-0.6B
# Sliding window # of chars (larger = fewer calls)
window_chars = 200
# Block on "controversial" verdict in addition to "unsafe" (controversial = political/
# religious/climate-denial/divisive content)
block_controversial = true
# Per-classification timeout in seconds (housekeeping parameter for final window)
timeout_s = 5.0
# Fixed warning when a blocked term is detected mid-stream
classification_message = This application is not able to answer certain queries. Please try again.
# Consequence when the answer doesn't follow the instance_guidelines set in
# INSTANCE_CONFIG_DIR/instance.yaml (independent of the framework-values check above,
# which always blocks regardless of this setting). Only meaningful under mode=llm —
# mode=classifier (Qwen3Guard-Gen) never evaluates instance guidelines at all, since
# it's a fixed-taxonomy model that can't take a custom prompt.
#   off   — ignore (default)
#   warn  — log only, never blocks the stream
#   block — also stops the stream (using classification_message), same as a framework violation
guideline_enforcement = off
# Independent LLM config for `mode = llm` (REQUIRED when classification_enabled = true AND mode = llm)
# Should be a small/fast model
llm_provider = huggingface
llm_model = https://xxxxxxxxxxx.huggingface.cloud
llm_max_tokens = 16
llm_temperature = 0.0
llm_inference_provider = XYZ
llm_organization = ABC

# --- 2. Keywords ---
# When false, the streaming blocklist filter is not applied.
blocklist_enabled = false
# Path to the blocklist file
blocklist_path = src/components/guardrails/blocklist.txt
# Fixed warning when a blocked term is detected mid-stream
blocklist_message = There was an error in the output. Please try again.

[ragas]
# LLM used by the RAGAS eval mode (tests/eval/eval.py --mode ragas) to judge/score
# metrics (faithfulness, answer relevancy, context recall, context precision).
# Eval-only — never read by the running application; kept here purely so all runtime
# config lives in one documented place (see CLAUDE.md).
# Deliberately independent of [generator]: judging with the same model that generated
# the answer risks self-preference bias in RAGAS-style scoring.
# Supported providers: openai, anthropic, cohere, azure, huggingface
# e.g. openai, anthropic, cohere, azure, huggingface
JUDGE_PROVIDER = your-provider
# e.g. gpt-4o, claude-sonnet-4-6, or a HF TGI endpoint URL
JUDGE_MODEL = your-model-name-or-url
JUDGE_MAX_TOKENS = 1024
JUDGE_TEMPERATURE = 0.1

# Azure only: required when JUDGE_PROVIDER = azure. JUDGE_MODEL = the Azure deployment name.
AZURE_ENDPOINT = https://your-resource.openai.azure.com/

# HuggingFace only: required when JUDGE_PROVIDER = huggingface.
# JUDGE_MODEL as a TGI/TEI endpoint URL (http...) routes to that container.
# JUDGE_MODEL as a bare repo id routes through HF's own inference-provider serverless API,
# in which case INFERENCE_PROVIDER/ORGANIZATION below apply.
INFERENCE_PROVIDER = huggingface
ORGANIZATION = your-org

# Comma-separated list of RAGAS metrics to compute.
# Available: faithfulness, answer_relevancy, context_recall, context_precision
METRICS = faithfulness,answer_relevancy,context_recall,context_precision