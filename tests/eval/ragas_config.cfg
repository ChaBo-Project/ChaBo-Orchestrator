[ragas]
# LLM used internally by RAGAS to score metrics (faithfulness, answer relevancy, etc.)
# Supported providers: openai, anthropic, cohere, azure, huggingface
# Set the corresponding API key as an environment variable (e.g. OPENAI_API_KEY, ANTHROPIC_API_KEY).
#
# Note: RAGAS metrics rely on the judge model's ability to follow complex instructions and
# reason about answer quality. Stronger models (proprietary or capable open-source ones)
# produce more reliable and consistent scores. Smaller or less capable models may yield
# noisy results, especially for faithfulness and answer relevancy.
JUDGE_PROVIDER = your-provider        # e.g. openai, anthropic, cohere, azure, huggingface
JUDGE_MODEL = your-model-name-or-url  # e.g. gpt-4o, claude-sonnet-4-6, or a HF endpoint URL

# Azure only: required when JUDGE_PROVIDER = azure
# JUDGE_MODEL should be set to the Azure deployment name.
AZURE_ENDPOINT = https://your-resource.openai.azure.com/

# HuggingFace only: required when JUDGE_PROVIDER = huggingface
# JUDGE_MODEL should be set to the full HF inference endpoint URL.
# HF_TOKEN is read from the environment variable HF_TOKEN.
INFERENCE_PROVIDER = huggingface
ORGANIZATION = your-org

# Comma-separated list of RAGAS metrics to compute.
# Available: faithfulness, answer_relevancy, context_recall, context_precision
METRICS = faithfulness,answer_relevancy,context_recall,context_precision
