[ragas]
# LLM used by the RAGAS eval CLI (run_eval.py) to judge/score metrics
# (faithfulness, context recall, context precision, factual correctness).
# Eval-only: lives next to the CLI, not in params.cfg, so it never ships in the image.
# Deliberately independent of [generator]: judging with the same model that generated
# the answer risks self-preference bias in RAGAS-style scoring.
# Every key can be overridden by an env var: RAGAS_<KEY>, e.g. RAGAS_JUDGE_MODEL.
#
# JUDGE_PROVIDER: azure | openai | huggingface_router | openai_compatible
# Use a capable model: RAGAS needs strict JSON output from the judge. Try a new judge
# with --limit 2 first; cases it cannot score show up as scoring_error.
JUDGE_PROVIDER = azure
# Model name (Azure: the deployment name; HF router: the Hub model ID)
JUDGE_MODEL = your-deployment-name
JUDGE_MAX_TOKENS = 1024
JUDGE_TEMPERATURE = 0.1

# azure: endpoint of the judge deployment. Key: env var AZURE_API_KEY
AZURE_ENDPOINT = https://your-resource.openai.azure.com/openai/v1/

# openai: no extra keys. Key: env var OPENAI_API_KEY

# huggingface_router: optional, same meaning as in [generator]. Key: env var HF_TOKEN
# INFERENCE_PROVIDER = auto
# ORGANIZATION = your-hf-org

# Optional: allow HTTP to one OpenAI-compatible judge on a private Docker network.
# Use the exact service name, without a domain or port. Leave this unset if the
# judge needs a real API key. The environment override is RAGAS_ALLOW_HTTP_JUDGE_HOST.
# ALLOW_HTTP_JUDGE_HOST = judge
# openai_compatible (vLLM, TGI, ...): server URL, and the env var that holds its key
# BASE_URL = https://your-server/v1
# API_KEY_ENV = RAGAS_JUDGE_API_KEY
