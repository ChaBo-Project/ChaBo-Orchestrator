services:
  qdrant:
    profiles: ["infra"]
    build:
      context: ..
      dockerfile: docker-compose/qdrant.Dockerfile
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/data
      
  tei-embedding:
    profiles: ["local"]
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.2
    # For GPU, use: ghcr.io/huggingface/text-embeddings-inference:1.9.2
    ports:
      - "8081:80"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - tei-embedding-data:/data
    command: --model-id ${TEI_EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  tei-reranker:
    profiles: ["local"]
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.2
    # For GPU, use: ghcr.io/huggingface/text-embeddings-inference:1.9.2
    ports:
      - "8082:80"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - tei-reranker-data:/data
    command: --model-id ${TEI_RERANKER_MODEL:-BAAI/bge-reranker-base}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # INPUT GUARDRAIL CLASSIFIER
  # Opt-in via the "guard" profile
  # only needed when [input_guard] mode=classifier. Qwen3Guard-Gen is a lightweight
  # generative model served over an OpenAI-compatible API (vLLM).
  # Point ChaBo at it with [input_guard] endpoint_url = http://qwen3guard:8000.
  # The default image is GPU; for CPU-only hosts use a CPU/vLLM-CPU build or a
  # llama.cpp GGUF server (e.g. QuantFactory/Qwen3Guard-Gen-0.6B-GGUF).
  qwen3guard:
    profiles: ["guard"]
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - qwen3guard-data:/root/.cache/huggingface
    command: >
      --model ${QWEN3GUARD_MODEL:-Qwen/Qwen3Guard-Gen-0.6B}
      --host 0.0.0.0 --port 8000 --max-model-len 32768
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  chabo:
    # local embedding services can take a while to startup
    depends_on:
        tei-embedding:
          condition: service_healthy
        tei-reranker:
          condition: service_healthy
        # For classifier-mode input guard, also run `--profile guard` and uncomment:
        # qwen3guard:
        #   condition: service_healthy
        #   required: false
    build:
      context: ..
      dockerfile: docker-compose/backend.Dockerfile
    ports:
      - "7860:7860"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      # Uncomment if using alternative LLM providers:
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - COHERE_API_KEY=${COHERE_API_KEY}
    volumes:
      - ..:/app            # Maps the root directory to /app
      - ../data:/app/data  # Specifically ensures the data folder is mapped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  chatui:
    build:
      context: .
      dockerfile: chatui.Dockerfile
    ports:
      - "3000:3000"
    # For testing in non-HTTPS environments, enable this and enter the public IP or domain name:
    # environment:
    #   - ORIGIN=http://localhost:3000


    volumes:
      - ./chatui.env.local:/app/.env.local:ro
      - chatui-db:/data/db
      - chatui-models:/data/models
    depends_on:
      chabo:
        condition: service_healthy

volumes:
  chatui-db:
  chatui-models:
  qdrant_data:
  tei-embedding-data:
  tei-reranker-data:
  qwen3guard-data:
